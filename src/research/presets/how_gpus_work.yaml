summary:
  headline: "How GPUs Work: Parallel Computing from Pixels to Neural Networks"
  executive_summary: >
    CPUs and GPUs are designed for different workloads. GPUs emphasize high-throughput parallel
    execution, using thread groups and specialized units for graphics, scientific computing, and
    machine-learning workloads. The exact performance depends on the application and hardware.
  key_takeaways:
    - "NVIDIA describes GPU execution using the SIMT model, with threads scheduled in warps."
    - "The NVIDIA H100 SXM5 specification lists 16,896 FP32 cores and 528 Tensor Cores."
    - "GPU speed depends on workload, data movement, and the device's architecture."

