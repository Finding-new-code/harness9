summary:
  headline: "The Apollo Guidance Computer: How 2K Words of RAM Helped Guide Humanity to the Moon"
  executive_summary: >
    Designed by MIT's Instrumentation Laboratory, the Apollo Guidance Computer supported spacecraft
    guidance, navigation, and control. NASA records describe a one-megahertz clock and fixed programs
    stored in core-rope memory. During Apollo 11's landing, radar data triggered program alarms while
    the computer continued higher-priority guidance work.
  key_takeaways:
    - "The MIT Instrumentation Laboratory designed the Apollo Guidance Computer."
    - "Its fixed memory used core-rope modules with wires routed through magnetic cores."
    - "Apollo 11's 1201 and 1202 alarms followed rendezvous-radar data overload."

