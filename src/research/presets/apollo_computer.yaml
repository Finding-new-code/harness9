summary:
  headline: "The Apollo Guidance Computer: How 4 Kilobytes of Core Rope Memory Guided Humanity to the Moon"
  executive_summary: >
    Developed by the MIT Instrumentation Laboratory under Margaret Hamilton and Hal Laning,
    the Apollo Guidance Computer (AGC) was one of the earliest systems to utilize silicon integrated
    circuits. Running at 1.024 MHz with 36,864 words of woven core rope memory, its priority-scheduled
    asynchronous operating system safely landed Apollo 11 despite radar telemetry overload.
  key_takeaways:
    - "First major embedded computer to employ silicon integrated logic circuits (NOR gates)."
    - "ROM software was physically hand-woven into magnetic ferrite core rope memory."
    - "Asynchronous priority scheduling and 1201/1202 alarm recovery saved the 1969 lunar landing."

