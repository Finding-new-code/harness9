summary:
  headline: "How Quantum Computers Work: Harnessing Superposition and Entanglement to Redefine Computation"
  executive_summary: >
    Classical computers encode information in bits; quantum computers use qubits that can be prepared
    in superpositions. A register can represent amplitudes over many basis states, but measurement
    returns one outcome. Quantum algorithms use operations that shape outcome probabilities, and any
    speedup depends on the problem and algorithm.
  key_takeaways:
    - "A qubit can be prepared in a superposition of computational basis states."
    - "An N-qubit register has amplitudes over 2^N basis states, but this is not a general-purpose parallel search."
    - "Quantum measurement returns one outcome; speedups are problem-specific."

