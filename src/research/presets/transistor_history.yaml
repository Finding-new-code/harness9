summary:
  headline: "The History of the Transistor: How Three Bell Labs Physicists Ignited the Digital Age in 1947"
  executive_summary: >
    Bell Labs demonstrated a point-contact transistor in December 1947 and announced the invention
    in June 1948. Bardeen, Brattain, and Shockley shared the 1956 Nobel Prize in Physics. Transistors
    offered a smaller, lower-power alternative to vacuum tubes in electronic devices.
  key_takeaways:
    - "The first laboratory demonstration took place on December 23, 1947."
    - "Bell Labs publicly announced the transistor on June 30, 1948."
    - "The Nobel Prize recognized Bardeen, Brattain, and Shockley's semiconductor research and discovery of the transistor effect."

