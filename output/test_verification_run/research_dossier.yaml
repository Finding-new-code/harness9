summary:
  executive_summary: 'In December 1947, John Bardeen, Walter Brattain, and William
    Shockley created the first working point-contact transistor at Bell Labs. Replacing
    fragile, power-hungry vacuum tubes, the transistor enabled solid-state electronics,
    microchips, and the modern computing era.

    '
  headline: 'The History of the Transistor: How Three Bell Labs Physicists Ignited
    the Digital Age in 1947'
  key_takeaways:
  - Invented in December 1947 at Bell Labs using germanium crystal and gold foil.
  - Bardeen, Brattain, and Shockley were awarded the 1956 Nobel Prize in Physics.
  - Modern microprocessors contain over 100 billion transistors on a single chip.
